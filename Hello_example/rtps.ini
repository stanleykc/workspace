[common]
DCPSDefaultDiscovery=DEFAULT_RTPS
DCPSGlobalTransportConfig=$file
DCPSDebugLevel=4

[rtps_discovery/DEFAULT_RTPS]
ResendPeriod=2
SedpMulticast=1
SpdpSendAddrs=239.255.0.2:7400
DefaultMulticastGroup=239.255.0.3:7401

[transport/the_rtps_transport]
transport_type=rtps_udp
use_multicast=1
multicast_group_address=239.255.0.3:7401
local_address=:7410